name: Veracode SCA Scan

on:
  workflow_call:
    inputs:
      path:
        description: "Ruta del módulo que será analizado"
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  sca-scan:
    name: SCA Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ejecutar Veracode SCA
        uses: veracode/veracode-sca@v2.1.10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ inputs.path }}
        env:
          SRCCLR_API_TOKEN: ${{ secrets.VERACODE_AGENT_TOKEN }}