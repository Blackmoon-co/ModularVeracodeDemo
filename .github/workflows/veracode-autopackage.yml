name: Veracode AutoPackage

on:
  workflow_call:
    inputs:
      module_name:
        description: "Nombre del módulo"
        required: true
        type: string

      source_path:
        description: "Ruta del módulo que será empaquetado"
        required: true
        type: string

      output_name:
        description: "Nombre final del ZIP"
        required: true
        type: string

      dotnet_version:
        description: "Versión de .NET"
        required: false
        type: string
        default: "8.0.x"

    outputs:
      artifact_name:
        description: "Nombre del artefacto publicado"
        value: ${{ jobs.package.outputs.artifact_name }}

      package_path:
        description: "Ruta del paquete generado"
        value: ${{ jobs.package.outputs.package_path }}

permissions:
  contents: read

jobs:
  package:
    name: AutoPackage - ${{ inputs.module_name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DOTNET_VERSION: ${{ inputs.dotnet_version }}
      SOURCE_PATH: ${{ inputs.source_path }}
      OUTPUT_NAME: ${{ inputs.output_name }}

    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      package_path: ${{ steps.package.outputs.package_path }}

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # Setup .NET
      # ==========================================================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      # ==========================================================
      # Instalar Veracode CLI
      # ==========================================================
      - name: Instalar Veracode CLI
        shell: bash
        run: |
          set -euo pipefail

          echo "Instalando Veracode CLI..."

          curl -fsSL https://tools.veracode.com/veracode-cli/install | sh

          echo "Contenido del workspace:"
          ls -la "$GITHUB_WORKSPACE"

          echo "Buscando ejecutable Veracode CLI..."

          VERACODE_BIN="$(command -v veracode || true)"

          if [[ -z "$VERACODE_BIN" && -x "$GITHUB_WORKSPACE/veracode" ]]; then
            VERACODE_BIN="$GITHUB_WORKSPACE/veracode"
          fi

          if [[ -z "$VERACODE_BIN" ]]; then
            VERACODE_BIN="$(
              find "$GITHUB_WORKSPACE" "$HOME" \
                -type f \
                -name "veracode" \
                -perm -111 \
                -print \
                -quit 2>/dev/null || true
            )"
          fi

          if [[ -z "$VERACODE_BIN" ]]; then
            echo "ERROR: No se encontró el ejecutable de Veracode CLI."

            echo "Archivos candidatos encontrados:"
            find "$GITHUB_WORKSPACE" "$HOME" \
              -type f \
              -iname "*veracode*" \
              -print 2>/dev/null || true

            exit 1
          fi

          chmod +x "$VERACODE_BIN"

          echo "Veracode CLI encontrado en:"
          echo "$VERACODE_BIN"

          echo "VERACODE_BIN=$VERACODE_BIN" >> "$GITHUB_ENV"

          echo "Versión instalada:"
          "$VERACODE_BIN" version

      # ==========================================================
      # Validar ruta del módulo
      # ==========================================================
      - name: Validar ruta del módulo
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "$SOURCE_PATH" ]]; then
            echo "ERROR: La ruta del módulo no existe:"
            echo "$SOURCE_PATH"
            exit 1
          fi

          echo "Ruta del módulo validada:"
          echo "$SOURCE_PATH"

          echo ""
          echo "Contenido principal del módulo:"

          find "$SOURCE_PATH" \
            -maxdepth 2 \
            -type f \
            -print \
            | head -n 100

      # ==========================================================
      # Ejecutar AutoPackage
      # ==========================================================
      - name: Ejecutar AutoPackage
        id: package
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/veracode/$OUTPUT_NAME"
          FINAL_DIR="$GITHUB_WORKSPACE/artifacts/veracode/final"
          FINAL_FILE="$FINAL_DIR/${OUTPUT_NAME}.zip"

          mkdir -p "$OUTPUT_DIR"
          mkdir -p "$FINAL_DIR"

          echo "========================================"
          echo "Veracode AutoPackage"
          echo "========================================"
          echo "Módulo: ${{ inputs.module_name }}"
          echo "Source: $SOURCE_PATH"
          echo "Output directory: $OUTPUT_DIR"
          echo "Final file: $FINAL_FILE"
          echo "========================================"

          "$VERACODE_BIN" package \
            --source "$SOURCE_PATH" \
            --type directory \
            --trust \
            --verbose \
            --output "$OUTPUT_DIR"

          echo ""
          echo "Contenido generado por AutoPackage:"

          find "$OUTPUT_DIR" \
            -maxdepth 4 \
            -type f \
            -print

          PACKAGE_FILE="$(
            find "$OUTPUT_DIR" \
              -type f \
              \( \
                -name "*.zip" -o \
                -name "*.jar" -o \
                -name "*.war" \
              \) \
              -print \
              -quit
          )"

          if [[ -z "$PACKAGE_FILE" ]]; then
            echo "ERROR: AutoPackage no generó un archivo ZIP, JAR o WAR."

            echo ""
            echo "Contenido completo del directorio de salida:"
            find "$OUTPUT_DIR" -maxdepth 5 -print || true

            exit 1
          fi

          echo ""
          echo "Paquete detectado:"
          echo "$PACKAGE_FILE"

          cp "$PACKAGE_FILE" "$FINAL_FILE"

          if [[ ! -f "$FINAL_FILE" ]]; then
            echo "ERROR: No se pudo crear el paquete final."
            exit 1
          fi

          if [[ ! -s "$FINAL_FILE" ]]; then
            echo "ERROR: El paquete final está vacío."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Paquete final generado correctamente"
          echo "========================================"

          ls -lh "$FINAL_FILE"

          echo "artifact_name=veracode-${OUTPUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "package_path=$FINAL_FILE" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # Validar paquete final
      # ==========================================================
      - name: Validar paquete final
        shell: bash
        run: |
          set -euo pipefail

          FINAL_FILE="$GITHUB_WORKSPACE/artifacts/veracode/final/${OUTPUT_NAME}.zip"

          if [[ ! -f "$FINAL_FILE" ]]; then
            echo "ERROR: No existe el paquete final:"
            echo "$FINAL_FILE"
            exit 1
          fi

          if [[ ! -s "$FINAL_FILE" ]]; then
            echo "ERROR: El paquete final está vacío:"
            echo "$FINAL_FILE"
            exit 1
          fi

          echo "Paquete listo para publicar:"
          ls -lh "$FINAL_FILE"

      # ==========================================================
      # Publicar artefacto
      # ==========================================================
      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: veracode-${{ inputs.output_name }}
          path: artifacts/veracode/final/${{ inputs.output_name }}.zip
          if-no-files-found: error
          retention-days: 7