name: Veracode modular scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: "Release"

jobs:

  # ============================================================
  # 1. Detectar módulos afectados
  # ============================================================

  detect-changes:
    name: Detectar módulos afectados
    runs-on: ubuntu-latest

    outputs:
      clientes: ${{ steps.changes.outputs.clientes }}
      reservas: ${{ steps.changes.outputs.reservas }}
      pagos: ${{ steps.changes.outputs.pagos }}
      all_modules: ${{ steps.changes.outputs.all_modules }}
      force_all: ${{ steps.manual.outputs.force_all }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar si es ejecución manual
        id: manual
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "force_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "force_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detectar cambios por Git
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          CLIENTES=false
          RESERVAS=false
          PAGOS=false
          ALL_MODULES=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLIENTES=true
            RESERVAS=true
            PAGOS=true
            ALL_MODULES=true
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            else
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.sha }}"
            fi

            # En algunos casos GitHub entrega un SHA compuesto
            # solamente por ceros, por ejemplo en el primer push.
            if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
            fi

            echo "Evento: ${{ github.event_name }}"
            echo "BASE_SHA: $BASE_SHA"
            echo "HEAD_SHA: $HEAD_SHA"

            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"

            echo "========================================="
            echo "Archivos modificados:"
            echo "$CHANGED_FILES"
            echo "========================================="

            # Cambios dentro del módulo Clientes
            if echo "$CHANGED_FILES" | grep -qE '^src/Modules/Clientes/'; then
              CLIENTES=true
            fi

            # Cambios dentro del módulo Reservas
            if echo "$CHANGED_FILES" | grep -qE '^src/Modules/Reservas/'; then
              RESERVAS=true
            fi

            # Cambios dentro del módulo Pagos
            if echo "$CHANGED_FILES" | grep -qE '^src/Modules/Pagos/'; then
              PAGOS=true
            fi

            # Cambios globales que requieren escanear todos los módulos
            if echo "$CHANGED_FILES" | grep -qE \
              '^src/Shared/|^scripts/|^\.github/workflows/|^veracode\.yml$|^veracode\.discover\.example\.yml$|\.sln$|Directory\.Build\.props$|Directory\.Build\.targets$|Directory\.Packages\.props$'; then
              ALL_MODULES=true
            fi
          fi

          echo "clientes=$CLIENTES" >> "$GITHUB_OUTPUT"
          echo "reservas=$RESERVAS" >> "$GITHUB_OUTPUT"
          echo "pagos=$PAGOS" >> "$GITHUB_OUTPUT"
          echo "all_modules=$ALL_MODULES" >> "$GITHUB_OUTPUT"

          echo "========================================="
          echo "Resultado de detección:"
          echo "Clientes: $CLIENTES"
          echo "Reservas: $RESERVAS"
          echo "Pagos: $PAGOS"
          echo "Todos los módulos: $ALL_MODULES"
          echo "========================================="

  # ============================================================
  # 2. Validar compilación de la solución completa
  # ============================================================

  build:
    name: Build solution
    needs: detect-changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ModularVeracodeDemo.sln

      - name: Build
        run: |
          dotnet build ModularVeracodeDemo.sln \
            --configuration "${{ env.CONFIGURATION }}" \
            --no-restore

  # ============================================================
  # 3. AutoPackage - Clientes
  # ============================================================

  package-clientes:
    name: AutoPackage - Clientes
    needs:
      - detect-changes
      - build

    if: >
      needs.detect-changes.outputs.clientes == 'true' ||
      needs.detect-changes.outputs.all_modules == 'true' ||
      needs.detect-changes.outputs.force_all == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ModularVeracodeDemo.sln

      - name: Instalar Veracode CLI
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS https://tools.veracode.com/veracode-cli/install | sh

          if [ -f "./veracode" ]; then
            chmod +x ./veracode
          fi

      - name: Verificar Veracode CLI
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "./veracode" ]; then
            ./veracode --version || ./veracode --help
          elif command -v veracode >/dev/null 2>&1; then
            veracode --version || veracode --help
          else
            echo "No se encontró el ejecutable de Veracode CLI."
            exit 1
          fi

      - name: Ejecutar AutoPackaging para Clientes
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_PATH="src/Modules/Clientes/VeracodeDemo.Clientes.Api"
          OUTPUT_DIR="artifacts/autopackage/clientes"
          FINAL_DIR="artifacts/veracode"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          mkdir -p "$FINAL_DIR"

          if [ -x "./veracode" ]; then
            ./veracode package \
              --source "$SOURCE_PATH" \
              --type directory \
              --trust \
              --verbose \
              --output "$OUTPUT_DIR"
          else
            veracode package \
              --source "$SOURCE_PATH" \
              --type directory \
              --trust \
              --verbose \
              --output "$OUTPUT_DIR"
          fi

          PACKAGE_FILE="$(find "$OUTPUT_DIR" -type f -iname '*.zip' | head -n 1)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "AutoPackaging no generó un archivo ZIP para Clientes."
            echo "Contenido generado:"
            find "$OUTPUT_DIR" -maxdepth 5 -type f -print || true
            exit 1
          fi

          cp "$PACKAGE_FILE" "$FINAL_DIR/clientes.zip"

          echo "Paquete generado para Clientes:"
          ls -lh "$FINAL_DIR/clientes.zip"

      - name: Verificar paquete Clientes
        shell: bash
        run: |
          set -euo pipefail

          test -f "artifacts/veracode/clientes.zip"
          test -s "artifacts/veracode/clientes.zip"

          echo "Paquete Clientes listo:"
          ls -lh artifacts/veracode/clientes.zip

      - name: Subir artefacto Clientes
        uses: actions/upload-artifact@v4
        with:
          name: veracode-artifact-clientes
          path: artifacts/veracode/clientes.zip
          if-no-files-found: error

  # ============================================================
  # 4. AutoPackage - Reservas
  # ============================================================

  package-reservas:
    name: AutoPackage - Reservas
    needs:
      - detect-changes
      - build

    if: >
      needs.detect-changes.outputs.reservas == 'true' ||
      needs.detect-changes.outputs.all_modules == 'true' ||
      needs.detect-changes.outputs.force_all == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ModularVeracodeDemo.sln

      - name: Instalar Veracode CLI
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS https://tools.veracode.com/veracode-cli/install | sh

          if [ -f "./veracode" ]; then
            chmod +x ./veracode
          fi

      - name: Verificar Veracode CLI
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "./veracode" ]; then
            ./veracode --version || ./veracode --help
          elif command -v veracode >/dev/null 2>&1; then
            veracode --version || veracode --help
          else
            echo "No se encontró el ejecutable de Veracode CLI."
            exit 1
          fi

      - name: Ejecutar AutoPackaging para Reservas
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_PATH="src/Modules/Reservas/VeracodeDemo.Reservas.Api"
          OUTPUT_DIR="artifacts/autopackage/reservas"
          FINAL_DIR="artifacts/veracode"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          mkdir -p "$FINAL_DIR"

          if [ -x "./veracode" ]; then
            ./veracode package \
              --source "$SOURCE_PATH" \
              --type directory \
              --trust \
              --verbose \
              --output "$OUTPUT_DIR"
          else
            veracode package \
              --source "$SOURCE_PATH" \
              --type directory \
              --trust \
              --verbose \
              --output "$OUTPUT_DIR"
          fi

          PACKAGE_FILE="$(find "$OUTPUT_DIR" -type f -iname '*.zip' | head -n 1)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "AutoPackaging no generó un archivo ZIP para Reservas."
            echo "Contenido generado:"
            find "$OUTPUT_DIR" -maxdepth 5 -type f -print || true
            exit 1
          fi

          cp "$PACKAGE_FILE" "$FINAL_DIR/reservas.zip"

          echo "Paquete generado para Reservas:"
          ls -lh "$FINAL_DIR/reservas.zip"

      - name: Verificar paquete Reservas
        shell: bash
        run: |
          set -euo pipefail

          test -f "artifacts/veracode/reservas.zip"
          test -s "artifacts/veracode/reservas.zip"

          echo "Paquete Reservas listo:"
          ls -lh artifacts/veracode/reservas.zip

      - name: Subir artefacto Reservas
        uses: actions/upload-artifact@v4
        with:
          name: veracode-artifact-reservas
          path: artifacts/veracode/reservas.zip
          if-no-files-found: error

  # ============================================================
  # 5. AutoPackage - Pagos
  # ============================================================

  package-pagos:
    name: AutoPackage - Pagos
    needs:
      - detect-changes
      - build

    if: >
      needs.detect-changes.outputs.pagos == 'true' ||
      needs.detect-changes.outputs.all_modules == 'true' ||
      needs.detect-changes.outputs.force_all == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ModularVeracodeDemo.sln

      - name: Instalar Veracode CLI
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS https://tools.veracode.com/veracode-cli/install | sh

          if [ -f "./veracode" ]; then
            chmod +x ./veracode
          fi

      - name: Verificar Veracode CLI
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "./veracode" ]; then
            ./veracode --version || ./veracode --help
          elif command -v veracode >/dev/null 2>&1; then
            veracode --version || veracode --help
          else
            echo "No se encontró el ejecutable de Veracode CLI."
            exit 1
          fi

      - name: Ejecutar AutoPackaging para Pagos
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_PATH="src/Modules/Pagos/VeracodeDemo.Pagos.Api"
          OUTPUT_DIR="artifacts/autopackage/pagos"
          FINAL_DIR="artifacts/veracode"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          mkdir -p "$FINAL_DIR"

          if [ -x "./veracode" ]; then
            ./veracode package \
              --source "$SOURCE_PATH" \
              --type directory \
              --trust \
              --verbose \
              --output "$OUTPUT_DIR"
          else
            veracode package \
              --source "$SOURCE_PATH" \
              --type directory \
              --trust \
              --verbose \
              --output "$OUTPUT_DIR"
          fi

          PACKAGE_FILE="$(find "$OUTPUT_DIR" -type f -iname '*.zip' | head -n 1)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "AutoPackaging no generó un archivo ZIP para Pagos."
            echo "Contenido generado:"
            find "$OUTPUT_DIR" -maxdepth 5 -type f -print || true
            exit 1
          fi

          cp "$PACKAGE_FILE" "$FINAL_DIR/pagos.zip"

          echo "Paquete generado para Pagos:"
          ls -lh "$FINAL_DIR/pagos.zip"

      - name: Verificar paquete Pagos
        shell: bash
        run: |
          set -euo pipefail

          test -f "artifacts/veracode/pagos.zip"
          test -s "artifacts/veracode/pagos.zip"

          echo "Paquete Pagos listo:"
          ls -lh artifacts/veracode/pagos.zip

      - name: Subir artefacto Pagos
        uses: actions/upload-artifact@v4
        with:
          name: veracode-artifact-pagos
          path: artifacts/veracode/pagos.zip
          if-no-files-found: error

  # ============================================================
  # 6. Pipeline Scan - Clientes
  # ============================================================

  scan-clientes:
    name: Pipeline Scan - Clientes
    needs: package-clientes
    if: needs.package-clientes.result == 'success'

    uses: ./.github/workflows/veracode-pipeline-scan.yml

    with:
      artifact_name: veracode-artifact-clientes
      veracode_policy_name: "Politica Restrictiva"
      json_output: true
      output_file: clientes-veracode-results.json
      fail_build: false
      verbose: true

    secrets: inherit

  # ============================================================
  # 7. Pipeline Scan - Reservas
  # ============================================================

  scan-reservas:
    name: Pipeline Scan - Reservas
    needs: package-reservas
    if: needs.package-reservas.result == 'success'

    uses: ./.github/workflows/veracode-pipeline-scan.yml

    with:
      artifact_name: veracode-artifact-reservas
      veracode_policy_name: "Politica Restrictiva"
      json_output: true
      output_file: reservas-veracode-results.json
      fail_build: false
      verbose: true

    secrets: inherit

  # ============================================================
  # 8. Pipeline Scan - Pagos
  # ============================================================

  scan-pagos:
    name: Pipeline Scan - Pagos
    needs: package-pagos
    if: needs.package-pagos.result == 'success'

    uses: ./.github/workflows/veracode-pipeline-scan.yml

    with:
      artifact_name: veracode-artifact-pagos
      veracode_policy_name: "Politica Restrictiva"
      json_output: true
      output_file: pagos-veracode-results.json
      fail_build: false
      verbose: true

    secrets: inherit

  # ============================================================
  # 9. SCA Scan - Clientes
  # ============================================================

  sca-clientes:
    name: SCA Scan - Clientes
    needs:
      - detect-changes
      - build

    if: >
      needs.detect-changes.outputs.clientes == 'true' ||
      needs.detect-changes.outputs.all_modules == 'true' ||
      needs.detect-changes.outputs.force_all == 'true'

    uses: ./.github/workflows/veracode-sca-scan.yml

    with:
      path: src/Modules/Clientes/VeracodeDemo.Clientes.Api

    secrets: inherit

  # ============================================================
  # 10. SCA Scan - Reservas
  # ============================================================

  sca-reservas:
    name: SCA Scan - Reservas
    needs:
      - detect-changes
      - build

    if: >
      needs.detect-changes.outputs.reservas == 'true' ||
      needs.detect-changes.outputs.all_modules == 'true' ||
      needs.detect-changes.outputs.force_all == 'true'

    uses: ./.github/workflows/veracode-sca-scan.yml

    with:
      path: src/Modules/Reservas/VeracodeDemo.Reservas.Api

    secrets: inherit

  # ============================================================
  # 11. SCA Scan - Pagos
  # ============================================================

  sca-pagos:
    name: SCA Scan - Pagos
    needs:
      - detect-changes
      - build

    if: >
      needs.detect-changes.outputs.pagos == 'true' ||
      needs.detect-changes.outputs.all_modules == 'true' ||
      needs.detect-changes.outputs.force_all == 'true'

    uses: ./.github/workflows/veracode-sca-scan.yml

    with:
      path: src/Modules/Pagos/VeracodeDemo.Pagos.Api

    secrets: inherit