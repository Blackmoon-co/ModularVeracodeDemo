name: Veracode Modular Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_all:
        description: "Forzar escaneo de todos los módulos"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

env:
  DOTNET_VERSION: "8.0.x"
  BUILD_CONFIGURATION: Release

jobs:

  # ============================================================
  # Detectar módulos modificados
  # ============================================================
  detect-changes:
    name: Detectar cambios
    runs-on: ubuntu-latest

    outputs:
      clientes: ${{ steps.changes.outputs.clientes }}
      reservas: ${{ steps.changes.outputs.reservas }}
      pagos: ${{ steps.changes.outputs.pagos }}
      all_modules: ${{ steps.changes.outputs.all_modules }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar módulos modificados
        id: changes
        shell: bash
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail

          echo "Analizando cambios..."

          if [[ "${FORCE_ALL:-false}" == "true" ]]; then
            echo "Se solicitó escaneo completo."
            echo "clientes=true" >> "$GITHUB_OUTPUT"
            echo "reservas=true" >> "$GITHUB_OUTPUT"
            echo "pagos=true" >> "$GITHUB_OUTPUT"
            echo "all_modules=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"

            # En caso de push inicial o SHA inválido, revisar todo.
            if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          echo "BASE_SHA: $BASE_SHA"
          echo "HEAD_SHA: $HEAD_SHA"

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"

          echo "Archivos modificados:"
          echo "$CHANGED_FILES"

          clientes=false
          reservas=false
          pagos=false
          all_modules=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              src/Modules/Clientes/*)
                clientes=true
                ;;

              src/Modules/Reservas/*)
                reservas=true
                ;;

              src/Modules/Pagos/*)
                pagos=true
                ;;

              src/Shared/*|\
              *.sln|\
              *.props|\
              *.targets|\
              global.json|\
              NuGet.config|\
              Directory.Build.*|\
              .github/*|\
              scripts/*)
                all_modules=true
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [[ "$all_modules" == "true" ]]; then
            clientes=true
            reservas=true
            pagos=true
          fi

          echo "clientes=$clientes" >> "$GITHUB_OUTPUT"
          echo "reservas=$reservas" >> "$GITHUB_OUTPUT"
          echo "pagos=$pagos" >> "$GITHUB_OUTPUT"
          echo "all_modules=$all_modules" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Resultado de detección:"
          echo "Clientes: $clientes"
          echo "Reservas: $reservas"
          echo "Pagos: $pagos"
          echo "Todos los módulos: $all_modules"

  # ============================================================
  # Build de la solución
  # ============================================================
  build:
    name: Build solución
    needs: detect-changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar solución
        run: |
          dotnet build \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-restore

  # ============================================================
  # Empaquetar Clientes
  # ============================================================
  package-clientes:
    name: Empaquetar Clientes
    needs:
      - detect-changes
      - build
    if: needs.detect-changes.outputs.clientes == 'true'
    uses: ./.github/workflows/veracode-autopackage.yml
    with:
      module_name: Clientes
      source_path: src/Modules/Clientes/VeracodeDemo.Clientes.Api
      output_name: clientes
      dotnet_version: "8.0.x"
    secrets: inherit

  # ============================================================
  # Empaquetar Reservas
  # ============================================================
  package-reservas:
    name: Empaquetar Reservas
    needs:
      - detect-changes
      - build
    if: needs.detect-changes.outputs.reservas == 'true'
    uses: ./.github/workflows/veracode-autopackage.yml
    with:
      module_name: Reservas
      source_path: src/Modules/Reservas/VeracodeDemo.Reservas.Api
      output_name: reservas
      dotnet_version: "8.0.x"
    secrets: inherit

  # ============================================================
  # Empaquetar Pagos
  # ============================================================
  package-pagos:
    name: Empaquetar Pagos
    needs:
      - detect-changes
      - build
    if: needs.detect-changes.outputs.pagos == 'true'
    uses: ./.github/workflows/veracode-autopackage.yml
    with:
      module_name: Pagos
      source_path: src/Modules/Pagos/VeracodeDemo.Pagos.Api
      output_name: pagos
      dotnet_version: "8.0.x"
    secrets: inherit

  # ============================================================
  # Pipeline Scan - Clientes
  # ============================================================
  scan-clientes:
    name: Pipeline Scan Clientes
    needs:
      - detect-changes
      - package-clientes
    if: |
      always() &&
      needs.detect-changes.outputs.clientes == 'true' &&
      needs.package-clientes.result == 'success'
    uses: ./.github/workflows/veracode-pipeline-scan.yml
    with:
      artifact_name: veracode-clientes
      policy_name: "Politica Restrictiva"
      output_file: clientes-results.txt
      json_output: clientes-results.json
      fail_build: false
      verbose: true
    secrets: inherit

  # ============================================================
  # Pipeline Scan - Reservas
  # ============================================================
  scan-reservas:
    name: Pipeline Scan Reservas
    needs:
      - detect-changes
      - package-reservas
    if: |
      always() &&
      needs.detect-changes.outputs.reservas == 'true' &&
      needs.package-reservas.result == 'success'
    uses: ./.github/workflows/veracode-pipeline-scan.yml
    with:
      artifact_name: veracode-reservas
      policy_name: "Politica Restrictiva"
      output_file: reservas-results.txt
      json_output: reservas-results.json
      fail_build: false
      verbose: true
    secrets: inherit

  # ============================================================
  # Pipeline Scan - Pagos
  # ============================================================
  scan-pagos:
    name: Pipeline Scan Pagos
    needs:
      - detect-changes
      - package-pagos
    if: |
      always() &&
      needs.detect-changes.outputs.pagos == 'true' &&
      needs.package-pagos.result == 'success'
    uses: ./.github/workflows/veracode-pipeline-scan.yml
    with:
      artifact_name: veracode-pagos
      policy_name: "Politica Restrictiva"
      output_file: pagos-results.txt
      json_output: pagos-results.json
      fail_build: false
      verbose: true
    secrets: inherit

  # ============================================================
  # SCA - Clientes
  # ============================================================
  sca-clientes:
    name: SCA Clientes
    needs:
      - detect-changes
      - package-clientes
    if: |
      always() &&
      needs.detect-changes.outputs.clientes == 'true' &&
      needs.package-clientes.result == 'success'
    uses: ./.github/workflows/veracode-sca-scan.yml
    with:
      path: src/Modules/Clientes/VeracodeDemo.Clientes.Api
    secrets: inherit

  # ============================================================
  # SCA - Reservas
  # ============================================================
  sca-reservas:
    name: SCA Reservas
    needs:
      - detect-changes
      - package-reservas
    if: |
      always() &&
      needs.detect-changes.outputs.reservas == 'true' &&
      needs.package-reservas.result == 'success'
    uses: ./.github/workflows/veracode-sca-scan.yml
    with:
      path: src/Modules/Reservas/VeracodeDemo.Reservas.Api
    secrets: inherit

  # ============================================================
  # SCA - Pagos
  # ============================================================
  sca-pagos:
    name: SCA Pagos
    needs:
      - detect-changes
      - package-pagos
    if: |
      always() &&
      needs.detect-changes.outputs.pagos == 'true' &&
      needs.package-pagos.result == 'success'
    uses: ./.github/workflows/veracode-sca-scan.yml
    with:
      path: src/Modules/Pagos/VeracodeDemo.Pagos.Api
    secrets: inherit