name: Veracode Modular Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_all:
        description: "Escanear todos los módulos"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write
  pull-requests: write

env:
  DOTNET_VERSION: "8.0.x"
  BUILD_CONFIGURATION: Release
  VERACODE_POLICY: "Politica Restrictiva"

jobs:

  # ============================================================
  # Detectar módulos modificados
  # ============================================================
  detect-changes:
    name: Detectar cambios
    runs-on: ubuntu-latest

    outputs:
      clientes: ${{ steps.changes.outputs.clientes }}
      reservas: ${{ steps.changes.outputs.reservas }}
      pagos: ${{ steps.changes.outputs.pagos }}
      all_modules: ${{ steps.changes.outputs.all_modules }}

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar módulos modificados
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail

          echo "Evento: ${EVENT_NAME}"
          echo "Force all: ${FORCE_ALL}"

          if [[ "${FORCE_ALL}" == "true" ]]; then
            echo "clientes=true" >> "$GITHUB_OUTPUT"
            echo "reservas=true" >> "$GITHUB_OUTPUT"
            echo "pagos=true" >> "$GITHUB_OUTPUT"
            echo "all_modules=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${PR_BASE_SHA}"
            HEAD_SHA="${PR_HEAD_SHA}"
          else
            BASE_SHA="${BEFORE_SHA}"
            HEAD_SHA="${CURRENT_SHA}"
          fi

          # En algunos push iniciales GitHub utiliza un SHA vacío.
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No existe SHA anterior. Se escanearán todos los módulos."
            CHANGED_FILES="$(git ls-files)"
          else
            echo "Comparando ${BASE_SHA} contra ${HEAD_SHA}"
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          echo "Archivos modificados:"
          echo "${CHANGED_FILES}"

          CLIENTES=false
          RESERVAS=false
          PAGOS=false
          ALL_MODULES=false

          # Cambios globales que afectan todos los módulos.
          if echo "${CHANGED_FILES}" | grep -Eq \
            '^(src/Shared/|.*\.sln$|.*\.props$|.*\.targets$|global\.json$|NuGet\.config$|Directory\.Build\.(props|targets)$|\.github/|scripts/)'; then
            ALL_MODULES=true
          fi

          # Cambios específicos por módulo.
          if echo "${CHANGED_FILES}" | grep -q '^src/Modules/Clientes/'; then
            CLIENTES=true
          fi

          if echo "${CHANGED_FILES}" | grep -q '^src/Modules/Reservas/'; then
            RESERVAS=true
          fi

          if echo "${CHANGED_FILES}" | grep -q '^src/Modules/Pagos/'; then
            PAGOS=true
          fi

          if [[ "${ALL_MODULES}" == "true" ]]; then
            CLIENTES=true
            RESERVAS=true
            PAGOS=true
          fi

          echo "clientes=${CLIENTES}" >> "$GITHUB_OUTPUT"
          echo "reservas=${RESERVAS}" >> "$GITHUB_OUTPUT"
          echo "pagos=${PAGOS}" >> "$GITHUB_OUTPUT"
          echo "all_modules=${ALL_MODULES}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Resultado:"
          echo "Clientes: ${CLIENTES}"
          echo "Reservas: ${RESERVAS}"
          echo "Pagos: ${PAGOS}"
          echo "Todos los módulos: ${ALL_MODULES}"

  # ============================================================
  # Compilación general
  # ============================================================
  build:
    name: Build de la solución
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore ModularVeracodeDemo.sln

      - name: Compilar solución
        run: |
          dotnet build ModularVeracodeDemo.sln \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-restore

  # ============================================================
  # Empaquetar Clientes
  # ============================================================
  package-clientes:
    name: Empaquetar Clientes
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build
    if: needs.detect-changes.outputs.clientes == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Instalar Veracode CLI
        shell: bash
        run: |
          curl -fsSL https://tools.veracode.com/veracode-cli/install \
            | sh

          echo "$HOME/.veracode-cli" >> "$GITHUB_PATH"

      - name: Crear directorio de artefactos
        run: mkdir -p artifacts/veracode

      - name: Empaquetar módulo Clientes con AutoPackager
        shell: bash
        run: |
          veracode package \
            --source src/Modules/Clientes/VeracodeDemo.Clientes.Api \
            --type directory \
            --trust \
            --verbose \
            --output artifacts/veracode/clientes

      - name: Localizar paquete generado
        shell: bash
        run: |
          PACKAGE="$(find artifacts/veracode/clientes -type f \( -name '*.zip' -o -name '*.jar' -o -name '*.war' \) | head -n 1)"

          if [[ -z "${PACKAGE}" ]]; then
            echo "No se encontró ningún paquete generado por AutoPackager."
            find artifacts/veracode/clientes -type f
            exit 1
          fi

          echo "Paquete encontrado: ${PACKAGE}"
          cp "${PACKAGE}" artifacts/veracode/clientes.zip

      - name: Subir artefacto Clientes
        uses: actions/upload-artifact@v4
        with:
          name: veracode-artifact-clientes
          path: artifacts/veracode/clientes.zip
          if-no-files-found: error

  # ============================================================
  # Empaquetar Reservas
  # ============================================================
  package-reservas:
    name: Empaquetar Reservas
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build
    if: needs.detect-changes.outputs.reservas == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Instalar Veracode CLI
        shell: bash
        run: |
          curl -fsSL https://tools.veracode.com/veracode-cli/install \
            | sh

          echo "$HOME/.veracode-cli" >> "$GITHUB_PATH"

      - name: Crear directorio de artefactos
        run: mkdir -p artifacts/veracode

      - name: Empaquetar módulo Reservas con AutoPackager
        shell: bash
        run: |
          veracode package \
            --source src/Modules/Reservas/VeracodeDemo.Reservas.Api \
            --type directory \
            --trust \
            --verbose \
            --output artifacts/veracode/reservas

      - name: Localizar paquete generado
        shell: bash
        run: |
          PACKAGE="$(find artifacts/veracode/reservas -type f \( -name '*.zip' -o -name '*.jar' -o -name '*.war' \) | head -n 1)"

          if [[ -z "${PACKAGE}" ]]; then
            echo "No se encontró ningún paquete generado por AutoPackager."
            find artifacts/veracode/reservas -type f
            exit 1
          fi

          echo "Paquete encontrado: ${PACKAGE}"
          cp "${PACKAGE}" artifacts/veracode/reservas.zip

      - name: Subir artefacto Reservas
        uses: actions/upload-artifact@v4
        with:
          name: veracode-artifact-reservas
          path: artifacts/veracode/reservas.zip
          if-no-files-found: error

  # ============================================================
  # Empaquetar Pagos
  # ============================================================
  package-pagos:
    name: Empaquetar Pagos
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build
    if: needs.detect-changes.outputs.pagos == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Instalar Veracode CLI
        shell: bash
        run: |
          curl -fsSL https://tools.veracode.com/veracode-cli/install \
            | sh

          echo "$HOME/.veracode-cli" >> "$GITHUB_PATH"

      - name: Crear directorio de artefactos
        run: mkdir -p artifacts/veracode

      - name: Empaquetar módulo Pagos con AutoPackager
        shell: bash
        run: |
          veracode package \
            --source src/Modules/Pagos/VeracodeDemo.Pagos.Api \
            --type directory \
            --trust \
            --verbose \
            --output artifacts/veracode/pagos

      - name: Localizar paquete generado
        shell: bash
        run: |
          PACKAGE="$(find artifacts/veracode/pagos -type f \( -name '*.zip' -o -name '*.jar' -o -name '*.war' \) | head -n 1)"

          if [[ -z "${PACKAGE}" ]]; then
            echo "No se encontró ningún paquete generado por AutoPackager."
            find artifacts/veracode/pagos -type f
            exit 1
          fi

          echo "Paquete encontrado: ${PACKAGE}"
          cp "${PACKAGE}" artifacts/veracode/pagos.zip

      - name: Subir artefacto Pagos
        uses: actions/upload-artifact@v4
        with:
          name: veracode-artifact-pagos
          path: artifacts/veracode/pagos.zip
          if-no-files-found: error

  # ============================================================
  # Pipeline Scan - Clientes
  # ============================================================
  scan-clientes:
    name: Pipeline Scan - Clientes
    needs:
      - detect-changes
      - package-clientes
    if: needs.detect-changes.outputs.clientes == 'true'

    uses: ./.github/workflows/veracode-pipeline-scan.yml
    with:
      artifact_name: veracode-artifact-clientes
      veracode_policy_name: 'Politica Restrictiva'
      output_file: veracode-clientes-results.json
      json_output: true
      fail_build: false
      verbose: true
    secrets: inherit

  # ============================================================
  # Pipeline Scan - Reservas
  # ============================================================
  scan-reservas:
    name: Pipeline Scan - Reservas
    needs:
      - detect-changes
      - package-reservas
    if: needs.detect-changes.outputs.reservas == 'true'

    uses: ./.github/workflows/veracode-pipeline-scan.yml
    with:
      artifact_name: veracode-artifact-reservas
      veracode_policy_name: 'Politica Restrictiva'
      output_file: veracode-reservas-results.json
      json_output: true
      fail_build: false
      verbose: true
    secrets: inherit

  # ============================================================
  # Pipeline Scan - Pagos
  # ============================================================
  scan-pagos:
    name: Pipeline Scan - Pagos
    needs:
      - detect-changes
      - package-pagos
    if: needs.detect-changes.outputs.pagos == 'true'

    uses: ./.github/workflows/veracode-pipeline-scan.yml
    with:
      artifact_name: veracode-artifact-pagos
      veracode_policy_name: 'Politica Restrictiva'
      output_file: veracode-pagos-results.json
      json_output: true
      fail_build: false
      verbose: true
    secrets: inherit

  # ============================================================
  # SCA - Clientes
  # ============================================================
  sca-clientes:
    name: SCA - Clientes
    needs: detect-changes
    if: needs.detect-changes.outputs.clientes == 'true'

    uses: ./.github/workflows/veracode-sca-scan.yml
    with:
      path: src/Modules/Clientes/VeracodeDemo.Clientes.Api
    secrets: inherit

  # ============================================================
  # SCA - Reservas
  # ============================================================
  sca-reservas:
    name: SCA - Reservas
    needs: detect-changes
    if: needs.detect-changes.outputs.reservas == 'true'

    uses: ./.github/workflows/veracode-sca-scan.yml
    with:
      path: src/Modules/Reservas/VeracodeDemo.Reservas.Api
    secrets: inherit

  # ============================================================
  # SCA - Pagos
  # ============================================================
  sca-pagos:
    name: SCA - Pagos
    needs: detect-changes
    if: needs.detect-changes.outputs.pagos == 'true'

    uses: ./.github/workflows/veracode-sca-scan.yml
    with:
      path: src/Modules/Pagos/VeracodeDemo.Pagos.Api
    secrets: inherit