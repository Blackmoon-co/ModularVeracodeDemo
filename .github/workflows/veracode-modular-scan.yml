name: Veracode Modular Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_all:
        description: "Escanear todos los módulos"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write
  pull-requests: write

env:
  DOTNET_VERSION: "8.0.x"
  BUILD_CONFIGURATION: Release
  VERACODE_POLICY: "Politica Restrictiva"

jobs:

  # ============================================================
  # Detectar cambios
  # ============================================================
  detect-changes:
    name: Detectar cambios
    runs-on: ubuntu-latest

    outputs:
      clientes: ${{ steps.changes.outputs.clientes }}
      reservas: ${{ steps.changes.outputs.reservas }}
      pagos: ${{ steps.changes.outputs.pagos }}
      all_modules: ${{ steps.changes.outputs.all_modules }}

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar módulos modificados
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Detección de cambios"
          echo "=========================================="
          echo "Evento: ${EVENT_NAME}"
          echo "Force all: ${FORCE_ALL}"

          if [[ "${FORCE_ALL}" == "true" ]]; then
            echo "Se forzó el escaneo de todos los módulos."

            echo "clientes=true" >> "$GITHUB_OUTPUT"
            echo "reservas=true" >> "$GITHUB_OUTPUT"
            echo "pagos=true" >> "$GITHUB_OUTPUT"
            echo "all_modules=true" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${PR_BASE_SHA}"
            HEAD_SHA="${PR_HEAD_SHA}"
          else
            BASE_SHA="${BEFORE_SHA}"
            HEAD_SHA="${CURRENT_SHA}"
          fi

          if [[ -z "${BASE_SHA}" ||
                "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then

            echo "No existe SHA anterior."
            echo "Se analizarán todos los archivos versionados."

            CHANGED_FILES="$(git ls-files)"

          else

            echo "Comparando commits:"
            echo "Base: ${BASE_SHA}"
            echo "Head: ${HEAD_SHA}"

            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"

          fi

          echo ""
          echo "Archivos modificados:"
          echo "${CHANGED_FILES}"

          CLIENTES=false
          RESERVAS=false
          PAGOS=false
          ALL_MODULES=false

          # ======================================================
          # Cambios transversales que afectan todos los módulos
          # ======================================================
          if echo "${CHANGED_FILES}" | grep -Eq \
            '^(src/Shared/|.*\.sln$|.*\.props$|.*\.targets$|global\.json$|NuGet\.config$|Directory\.Build\.(props|targets)$|\.github/|scripts/)'; then

            echo ""
            echo "Se detectaron cambios transversales."
            echo "Se analizarán todos los módulos."

            ALL_MODULES=true
          fi

          # ======================================================
          # Clientes
          # ======================================================
          if echo "${CHANGED_FILES}" | grep -q '^src/Modules/Clientes/'; then
            CLIENTES=true
          fi

          # ======================================================
          # Reservas
          # ======================================================
          if echo "${CHANGED_FILES}" | grep -q '^src/Modules/Reservas/'; then
            RESERVAS=true
          fi

          # ======================================================
          # Pagos
          # ======================================================
          if echo "${CHANGED_FILES}" | grep -q '^src/Modules/Pagos/'; then
            PAGOS=true
          fi

          # ======================================================
          # Si hay cambios transversales, activar todos
          # ======================================================
          if [[ "${ALL_MODULES}" == "true" ]]; then
            CLIENTES=true
            RESERVAS=true
            PAGOS=true
          fi

          echo "clientes=${CLIENTES}" >> "$GITHUB_OUTPUT"
          echo "reservas=${RESERVAS}" >> "$GITHUB_OUTPUT"
          echo "pagos=${PAGOS}" >> "$GITHUB_OUTPUT"
          echo "all_modules=${ALL_MODULES}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "Resultado de detección"
          echo "=========================================="
          echo "Clientes: ${CLIENTES}"
          echo "Reservas: ${RESERVAS}"
          echo "Pagos: ${PAGOS}"
          echo "Todos los módulos: ${ALL_MODULES}"

  # ============================================================
  # Build general
  # ============================================================
  build:
    name: Build de la solución
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: |
          dotnet restore ModularVeracodeDemo.sln

      - name: Compilar solución
        run: |
          dotnet build ModularVeracodeDemo.sln \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-restore

  # ============================================================
  # AutoPackage - Clientes
  # ============================================================
  package-clientes:
    name: AutoPackage - Clientes

    needs:
      - detect-changes
      - build

    if: |
      needs.detect-changes.outputs.clientes == 'true'

    uses: ./.github/workflows/veracode-autopackage.yml

    with:
      module_name: Clientes
      source_path: src/Modules/Clientes/VeracodeDemo.Clientes.Api
      output_name: clientes
      dotnet_version: "8.0.x"

  # ============================================================
  # AutoPackage - Reservas
  # ============================================================
  package-reservas:
    name: AutoPackage - Reservas

    needs:
      - detect-changes
      - build

    if: |
      needs.detect-changes.outputs.reservas == 'true'

    uses: ./.github/workflows/veracode-autopackage.yml

    with:
      module_name: Reservas
      source_path: src/Modules/Reservas/VeracodeDemo.Reservas.Api
      output_name: reservas
      dotnet_version: "8.0.x"

  # ============================================================
  # AutoPackage - Pagos
  # ============================================================
  package-pagos:
    name: AutoPackage - Pagos

    needs:
      - detect-changes
      - build

    if: |
      needs.detect-changes.outputs.pagos == 'true'

    uses: ./.github/workflows/veracode-autopackage.yml

    with:
      module_name: Pagos
      source_path: src/Modules/Pagos/VeracodeDemo.Pagos.Api
      output_name: pagos
      dotnet_version: "8.0.x"

  # ============================================================
  # Pipeline Scan - Clientes
  # ============================================================
  scan-clientes:
    name: Pipeline Scan - Clientes

    needs:
      - detect-changes
      - package-clientes

    if: |
      needs.detect-changes.outputs.clientes == 'true' &&
      needs.package-clientes.result == 'success'

    uses: ./.github/workflows/veracode-pipeline-scan.yml

    with:
      artifact_name: veracode-clientes
      policy_name: "Politica Restrictiva"
      output_file: veracode-clientes-results.json
      json_output: true
      fail_build: false
      verbose: true

    secrets: inherit

  # ============================================================
  # Pipeline Scan - Reservas
  # ============================================================
  scan-reservas:
    name: Pipeline Scan - Reservas

    needs:
      - detect-changes
      - package-reservas

    if: |
      needs.detect-changes.outputs.reservas == 'true' &&
      needs.package-reservas.result == 'success'

    uses: ./.github/workflows/veracode-pipeline-scan.yml

    with:
      artifact_name: veracode-reservas
      policy_name: "Politica Restrictiva"
      output_file: veracode-reservas-results.json
      json_output: true
      fail_build: false
      verbose: true

    secrets: inherit

  # ============================================================
  # Pipeline Scan - Pagos
  # ============================================================
  scan-pagos:
    name: Pipeline Scan - Pagos

    needs:
      - detect-changes
      - package-pagos

    if: |
      needs.detect-changes.outputs.pagos == 'true' &&
      needs.package-pagos.result == 'success'

    uses: ./.github/workflows/veracode-pipeline-scan.yml

    with:
      artifact_name: veracode-pagos
      policy_name: "Politica Restrictiva"
      output_file: veracode-pagos-results.json
      json_output: true
      fail_build: false
      verbose: true

    secrets: inherit

  # ============================================================
  # SCA - Clientes
  # ============================================================
  sca-clientes:
    name: SCA - Clientes

    needs:
      - detect-changes

    if: |
      needs.detect-changes.outputs.clientes == 'true'

    uses: ./.github/workflows/veracode-sca-scan.yml

    with:
      path: src/Modules/Clientes/VeracodeDemo.Clientes.Api

    secrets: inherit

  # ============================================================
  # SCA - Reservas
  # ============================================================
  sca-reservas:
    name: SCA - Reservas

    needs:
      - detect-changes

    if: |
      needs.detect-changes.outputs.reservas == 'true'

    uses: ./.github/workflows/veracode-sca-scan.yml

    with:
      path: src/Modules/Reservas/VeracodeDemo.Reservas.Api

    secrets: inherit

  # ============================================================
  # SCA - Pagos
  # ============================================================
  sca-pagos:
    name: SCA - Pagos

    needs:
      - detect-changes

    if: |
      needs.detect-changes.outputs.pagos == 'true'

    uses: ./.github/workflows/veracode-sca-scan.yml

    with:
      path: src/Modules/Pagos/VeracodeDemo.Pagos.Api

    secrets: inherit