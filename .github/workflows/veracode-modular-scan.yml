name: Veracode Modular Scan

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_all:
        description: "Escanear todos los módulos"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  issues: write
  security-events: write

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  # ============================================================
  # 1. Detectar módulos modificados
  # ============================================================
  detect-changes:
    name: Detectar cambios
    runs-on: ubuntu-latest

    outputs:
      clientes: ${{ steps.detect.outputs.clientes }}
      reservas: ${{ steps.detect.outputs.reservas }}
      pagos: ${{ steps.detect.outputs.pagos }}
      all_modules: ${{ steps.detect.outputs.all_modules }}

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar módulos modificados
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          set -euo pipefail

          CLIENTES="false"
          RESERVAS="false"
          PAGOS="false"
          ALL_MODULES="false"

          echo "Evento: ${EVENT_NAME}"
          echo "Force all: ${FORCE_ALL:-false}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${PR_BASE_SHA}"
            HEAD_SHA="${PR_HEAD_SHA}"

          elif [[ "${EVENT_NAME}" == "push" ]]; then
            BASE_SHA="${EVENT_BEFORE}"
            HEAD_SHA="${GITHUB_SHA}"

          else
            BASE_SHA=""
            HEAD_SHA="${GITHUB_SHA}"
          fi

          if [[ "${FORCE_ALL:-false}" == "true" ]]; then
            echo "Ejecución manual: se escanearán todos los módulos."
            ALL_MODULES="true"

          else
            if [[ -n "${BASE_SHA}" ]] &&
               [[ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then

              CHANGED_FILES="$(
                git diff --name-only "${BASE_SHA}" "${HEAD_SHA}"
              )"

            else
              CHANGED_FILES="$(
                git show \
                  --pretty="" \
                  --name-only \
                  "${HEAD_SHA}"
              )"
            fi

            echo ""
            echo "Archivos modificados:"
            echo "---------------------"
            echo "${CHANGED_FILES}"
            echo ""

            while IFS= read -r FILE; do
              [[ -z "${FILE}" ]] && continue

              case "${FILE}" in
                src/Modules/Clientes/*)
                  CLIENTES="true"
                  ;;

                src/Modules/Reservas/*)
                  RESERVAS="true"
                  ;;

                src/Modules/Pagos/*)
                  PAGOS="true"
                  ;;

                src/Shared/*)
                  ALL_MODULES="true"
                  ;;

                *.sln)
                  ALL_MODULES="true"
                  ;;

                *.props)
                  ALL_MODULES="true"
                  ;;

                *.targets)
                  ALL_MODULES="true"
                  ;;

                global.json)
                  ALL_MODULES="true"
                  ;;

                NuGet.config)
                  ALL_MODULES="true"
                  ;;

                Directory.Build.*)
                  ALL_MODULES="true"
                  ;;

                .github/*)
                  ALL_MODULES="true"
                  ;;

                scripts/*)
                  ALL_MODULES="true"
                  ;;

                Dockerfile)
                  ALL_MODULES="true"
                  ;;

                docker-compose*.yml)
                  ALL_MODULES="true"
                  ;;
              esac
            done <<< "${CHANGED_FILES}"
          fi

          if [[ "${ALL_MODULES}" == "true" ]]; then
            CLIENTES="true"
            RESERVAS="true"
            PAGOS="true"
          fi

          echo "clientes=${CLIENTES}" >> "${GITHUB_OUTPUT}"
          echo "reservas=${RESERVAS}" >> "${GITHUB_OUTPUT}"
          echo "pagos=${PAGOS}" >> "${GITHUB_OUTPUT}"
          echo "all_modules=${ALL_MODULES}" >> "${GITHUB_OUTPUT}"

          echo ""
          echo "Resultado:"
          echo "----------"
          echo "Clientes: ${CLIENTES}"
          echo "Reservas: ${RESERVAS}"
          echo "Pagos: ${PAGOS}"
          echo "Todos los módulos: ${ALL_MODULES}"

  # ============================================================
  # 2. AutoPackage - Clientes
  # ============================================================
  package-clientes:
    name: AutoPackage Clientes
    needs:
      - detect-changes

    if: needs.detect-changes.outputs.clientes == 'true'

    uses: ./.github/workflows/veracode-autopackage.yml

    with:
      module_name: Clientes
      source_path: src/Modules/Clientes/VeracodeDemo.Clientes.Api
      output_name: clientes
      dotnet_version: "8.0.x"

  # ============================================================
  # 3. AutoPackage - Reservas
  # ============================================================
  package-reservas:
    name: AutoPackage Reservas
    needs:
      - detect-changes

    if: needs.detect-changes.outputs.reservas == 'true'

    uses: ./.github/workflows/veracode-autopackage.yml

    with:
      module_name: Reservas
      source_path: src/Modules/Reservas/VeracodeDemo.Reservas.Api
      output_name: reservas
      dotnet_version: "8.0.x"

  # ============================================================
  # 4. AutoPackage - Pagos
  # ============================================================
  package-pagos:
    name: AutoPackage Pagos
    needs:
      - detect-changes

    if: needs.detect-changes.outputs.pagos == 'true'

    uses: ./.github/workflows/veracode-autopackage.yml

    with:
      module_name: Pagos
      source_path: src/Modules/Pagos/VeracodeDemo.Pagos.Api
      output_name: pagos
      dotnet_version: "8.0.x"

  # ============================================================
  # 5. Pipeline Scan - Clientes
  # Solo push a feature/*
  # ============================================================
  scan-clientes:
    name: Pipeline Scan Clientes
    needs:
      - detect-changes
      - package-clientes

    if: |
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/feature/') &&
      needs.detect-changes.outputs.clientes == 'true' &&
      needs.package-clientes.result == 'success'

    uses: ./.github/workflows/veracode-pipeline-scan.yml

    with:
      artifact_name: veracode-clientes
      policy_name: "Politica Restrictiva"
      json_output: true
      output_file: clientes-results.json
      fail_build: false
      verbose: true

    secrets:
      VERACODE_API_ID_REPO: ${{ secrets.VERACODE_API_ID_REPO }}
      VERACODE_API_KEY_SECRET_REPO: ${{ secrets.VERACODE_API_KEY_SECRET_REPO }}

  # ============================================================
  # 6. Pipeline Scan - Reservas
  # Solo push a feature/*
  # ============================================================
  scan-reservas:
    name: Pipeline Scan Reservas
    needs:
      - detect-changes
      - package-reservas

    if: |
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/feature/') &&
      needs.detect-changes.outputs.reservas == 'true' &&
      needs.package-reservas.result == 'success'

    uses: ./.github/workflows/veracode-pipeline-scan.yml

    with:
      artifact_name: veracode-reservas
      policy_name: "Politica Restrictiva"
      json_output: true
      output_file: reservas-results.json
      fail_build: false
      verbose: true

    secrets:
      VERACODE_API_ID_REPO: ${{ secrets.VERACODE_API_ID_REPO }}
      VERACODE_API_KEY_SECRET_REPO: ${{ secrets.VERACODE_API_KEY_SECRET_REPO }}

  # ============================================================
  # 7. Pipeline Scan - Pagos
  # Solo push a feature/*
  # ============================================================
  scan-pagos:
    name: Pipeline Scan Pagos
    needs:
      - detect-changes
      - package-pagos

    if: |
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/feature/') &&
      needs.detect-changes.outputs.pagos == 'true' &&
      needs.package-pagos.result == 'success'

    uses: ./.github/workflows/veracode-pipeline-scan.yml

    with:
      artifact_name: veracode-pagos
      policy_name: "Politica Restrictiva"
      json_output: true
      output_file: pagos-results.json
      fail_build: false
      verbose: true

    secrets:
      VERACODE_API_ID_REPO: ${{ secrets.VERACODE_API_ID_REPO }}
      VERACODE_API_KEY_SECRET_REPO: ${{ secrets.VERACODE_API_KEY_SECRET_REPO }}
