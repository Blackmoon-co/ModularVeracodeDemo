name: Veracode Pipeline Scan

on:
  workflow_call:
    inputs:
      policy_name:
        description: "Nombre de la política de Veracode"
        required: true
        type: string

      json_output:
        description: "Generar resultados en formato JSON"
        required: false
        type: boolean
        default: true

      output_file:
        description: "Nombre del archivo de resultados"
        required: false
        type: string
        default: veracode-results.json

      fail_build:
        description: "Fallar el workflow si se encuentran vulnerabilidades"
        required: false
        type: boolean
        default: false

      verbose:
        description: "Mostrar salida detallada"
        required: false
        type: boolean
        default: true

      artifact_name:
        description: "Nombre del artefacto que contiene el paquete de Veracode"
        required: false
        type: string
        default: veracode-artifact

    secrets:
      VERACODE_API_ID_REPO:
        description: "Veracode API ID"
        required: true

      VERACODE_API_KEY_SECRET_REPO:
        description: "Veracode API Key Secret"
        required: true

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

jobs:
  pipeline-scan:
    name: Pipeline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}

      - name: Detect artifact for Veracode
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          artifact="$(
            find . -type f \
              \( -name "*.zip" -o -name "*.war" -o -name "*.jar" -o -name "*.ear" \) \
              | head -n 1
          )"

          if [[ -z "$artifact" ]]; then
            echo "::error::No valid Veracode artifact found"
            exit 1
          fi

          echo "Artifact detected: $artifact"
          echo "artifact_path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Run Veracode Pipeline Scan
        uses: veracode/Veracode-pipeline-scan-action@v1.0.18
        with:
          vid: ${{ secrets.VERACODE_API_ID_REPO }}
          vkey: ${{ secrets.VERACODE_API_KEY_SECRET_REPO }}
          file: ${{ steps.detect.outputs.artifact_path }}
          json_output: ${{ inputs.json_output }}
          verbose: ${{ inputs.verbose }}
          json_output_file: ${{ inputs.output_file }}
          veracode_policy_name: ${{ inputs.policy_name }}
          fail_build: ${{ inputs.fail_build }}

      - name: Upload Veracode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veracode-pipeline-scan-results-${{ inputs.artifact_name }}
          path: ${{ inputs.output_file }}
          if-no-files-found: warn