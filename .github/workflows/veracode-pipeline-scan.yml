name: Veracode pipeline scan

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

on:
  workflow_call:
    inputs:
      policy_name:
        required: true
        type: string
      json_output:
        required: false
        type: boolean
        default: true
      output_file:
        required: false
        type: string
        default: veracode-results.json
      fail_build:
        required: false
        type: boolean
        default: false
      verbose:
        required: false
        type: boolean
        default: true
      artifact_name:
        description: Nombre del artefacto que contiene el paquete de Veracode
        required: false
        type: string
        default: veracode-artifact
        
jobs:
  pipeline-scan:
    runs-on: ubuntu-latest
    steps:

      - name: Downloading artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}

      - name: Detect artifact for Veracode
        id: detect
        run: |
          artifact=$(find . -type f \( -name "*.zip" -o -name "*.war" -o -name "*.jar" -o -name "*.ear" \) | head -n 1)

          if [ -z "$artifact" ]; then
            echo "::error::No valid artifact found"
            exit 1
          fi

          echo "Artifact detected: $artifact"
          echo "artifact_path=$artifact" >> $GITHUB_OUTPUT

      - name: Pipeline-Scan veracode
        uses: veracode/Veracode-pipeline-scan-action@v1.0.18
        with:
          vid: ${{ secrets.VERACODE_API_ID_REPO }}
          vkey: ${{ secrets.VERACODE_API_KEY_SECRET_REPO }}
          file: ${{ steps.detect.outputs.artifact_path }}
          json_output: ${{ inputs.json_output }}
          verbose: ${{ inputs.verbose }}
          json_output_file: ${{ inputs.output_file }}
          veracode_policy_name: ${{ inputs.policy_name }}
          fail_build: ${{ inputs.fail_build }}
         
      - name: Upload Veracode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veracode-pipeline-scan-results
          path: ${{ inputs.output_file }}
          if-no-files-found: warn